name: Generate Contribution Snake

on:
  schedule:
    # run automatically once every day
    - cron: "0 0 * * *"
  
  # support manual execution using workflow_dispatch
  workflow_dispatch:

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=white&color_dots=%230a192f,%230f3360,%231a59a8,%23217be5,%2300bfff
            dist/github-contribution-grid-snake-dark.svg?color_snake=white&color_dots=%230a192f,%230f3360,%231a59a8,%23217be5,%2300bfff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
